# Kubernetes Secret template for FitVibe.
#
# Do not put real credentials in this file and push to git. Copy locally, fill in
# values, and apply from a secure machine, or use Sealed Secrets / External Secrets.
#
# Example (local only):
#   cp secrets.yaml secrets.local.yaml
#   # edit secrets.local.yaml — ensure secrets.local.yaml is gitignored
#   kubectl apply -f secrets.local.yaml

apiVersion: v1
kind: Secret
metadata:
  name: fitvibe-secrets
  namespace: fitvibe
  labels:
    app: fitvibe
type: Opaque
stringData:
  postgres-user: "CHANGE_ME"
  postgres-password: "CHANGE_ME"
  redis-password: "CHANGE_ME"
  redis-url: "redis://:CHANGE_ME@redis:6379"
  smtp-host: "smtp.example.com"
  smtp-port: "587"
  smtp-user: "CHANGE_ME"
  smtp-password: "CHANGE_ME"
  smtp-from-email: "CHANGE_ME"
  database-url: "postgresql://USER:PASSWORD@postgres:5432/fitvibe?sslmode=require"

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: fitvibe
  labels:
    app: fitvibe
type: Opaque
stringData:
  # Replace with real PEM contents, or create the secret with:
  # kubectl create secret generic jwt-keys -n fitvibe \
  #   --from-file=jwt_private.pem=./jwt_private.pem \
  #   --from-file=jwt_public.pem=./jwt_public.pem
  jwt_private.pem: |
    -----BEGIN PLACEHOLDER-----
    Replace with RSA private key PEM
    -----END PLACEHOLDER-----
  jwt_public.pem: |
    -----BEGIN PLACEHOLDER-----
    Replace with RSA public key PEM
    -----END PLACEHOLDER-----
