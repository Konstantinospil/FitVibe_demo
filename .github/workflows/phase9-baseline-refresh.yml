name: Phase 9 Visual Baseline Refresh

on:
  pull_request:
    branches: [dev]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh-settings-baselines:
    if: github.head_ref == 'phase9/preference-contract-coherence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout Phase 9 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-offline

      - name: Build visual frontend
        run: pnpm --filter @fitvibe/frontend run build:visual

      - name: Start preview server
        working-directory: apps/frontend
        run: |
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort --outDir dist/client &
          echo $! > "${GITHUB_WORKSPACE}/preview-server.pid"
          python3 - <<'PY'
          import http.client, sys, time
          for _ in range(60):
              try:
                  conn = http.client.HTTPConnection('127.0.0.1', 4173, timeout=2)
                  conn.request('GET', '/')
                  response = conn.getresponse()
                  status = response.status
                  response.read()
                  conn.close()
                  if 200 <= status < 400:
                      sys.exit(0)
              except Exception:
                  pass
              time.sleep(2)
          sys.exit(1)
          PY

      - name: Refresh settings baselines only
        env:
          APP_URL: http://127.0.0.1:4173
          CI: 'true'
          DISABLE_WEBSERVER: 'true'
        run: >-
          pnpm exec playwright test tests/frontend/visual/pages/settings.spec.ts
          --config tests/frontend/visual/config/playwright.config.ts
          --update-snapshots=changed

      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/frontend/visual/pages/settings.spec.ts-snapshots/settings-ui-*-linux.png
          if git diff --cached --quiet; then
            echo "No settings baseline changes produced"
            exit 0
          fi
          git commit -m "test(phase9): refresh settings visual baselines"
          git push origin HEAD:${{ github.head_ref }}
